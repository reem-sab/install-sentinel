# Runs the Camunda 8 Self-Managed "kind" guide the way a reader would, in
# no-domain mode with PostgreSQL secondary storage, across three doc versions.
#
# The workflow clones camunda/camunda-docs into ./camunda-docs first.
# Paths here are relative to this file.

defaults:
  siteRoot: ../../camunda-docs
  sections:
    - Secondary storage options
    - Download the reference architecture
    - Create the Kubernetes cluster
    - No-domain mode deployment
    - Verify deployment
  teardown:
    - Cleanup
  skip:
    # Makefile shortcuts repeat the manual steps this run already follows.
    - '^\s*(SECONDARY_STORAGE=\w+ )?make '
    # Watches pods until you press Ctrl+C. The readiness script covers the same wait.
    - 'kubectl get pods .*-w\s*$'
  env:
    # The guide asks you to choose; PostgreSQL is the lighter of the two.
    SECONDARY_STORAGE: postgres
  stepTimeoutMinutes: 40
  assertions:
    - name: Three nodes are Ready
      run: kubectl get nodes --no-headers | grep -cw Ready
      expect: "3"
    - name: The Helm release is deployed
      # The chart prints long release notes after the status line, and a check
      # only reads the last 40 lines of output, so keep just the status line.
      run: helm status camunda -n camunda | grep STATUS
      expect: "STATUS: deployed"
    - name: Every pod in the camunda namespace is ready
      run: kubectl wait --for=condition=Ready pods --all -n camunda --timeout=60s
      retries: 10
      intervalSeconds: 30

targets:
  - name: camunda-next
    guide: ../../camunda-docs/docs/self-managed/deployment/helm/cloud-providers/kind.md
    # Off until the Helm v4 item in Possible next work is done.
    openIssues: false
    env:
      # A target's env replaces the defaults, so repeat the storage choice here.
      SECONDARY_STORAGE: postgres
      # Next deploys a pre-release chart, and the deploy script asks you to confirm
      # that. A reader answers the prompt; CI has no terminal, so answer it here.
      CAMUNDA_PRERELEASE_ACK: "true"
  - name: camunda-8.9
    guide: ../../camunda-docs/versioned_docs/version-8.9/self-managed/deployment/helm/cloud-providers/kind.md
  - name: camunda-8.8
    guide: ../../camunda-docs/versioned_docs/version-8.8/self-managed/deployment/helm/cloud-providers/kind.md
