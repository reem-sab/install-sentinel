name: Install check

# Install guides break when something upstream changes, not only when the docs
# change. A schedule catches the first kind; the pull request trigger catches the second.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/podinfo/**"
      - "src/**"
      - "dist/**"

permissions:
  contents: read

jobs:
  podinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [podinfo-next, podinfo-6.14]
    steps:
      - uses: actions/checkout@v5
      # The guide creates its own cluster, so this only installs the kind binary.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: ./
        with:
          mode: run
          config: examples/podinfo/sentinel.yml
          target: ${{ matrix.target }}
      - name: Delete leftover clusters
        if: always()
        run: kind get clusters | xargs -r -n1 kind delete cluster --name
