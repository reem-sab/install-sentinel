name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The action runs from dist/, so dist/ has to match the source it was built from.
      - name: Check that dist is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run npm run build and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

  validate-own-docs:
    # The action checks this repository's example guides on every change. On a
    # pull request it checks only the guides the pull request changed.
    runs-on: ubuntu-latest
    steps:
      # The full history, so the pull request's base commit is there to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          mode: validate
          paths: examples/**/*.md
          changed-only: true
