name: Camunda kind guide

# Runs the Camunda 8 Self-Managed kind guide as written, for three doc versions.
# Manual and weekly only: each run takes a while and pulls several GB of images.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  # Scheduled runs open an issue for a failing guide and close it when the guide passes again.
  issues: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [camunda-next, camunda-8.9, camunda-8.8]
    steps:
      - uses: actions/checkout@v7

      - name: Check out the Camunda docs (Self-Managed pages only)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/camunda/camunda-docs.git
          cd camunda-docs
          git sparse-checkout set --no-cone '/docs/self-managed/' '/versioned_docs/*/self-managed/'

      # Record CPU, memory, and disk before cleanup, so each run shows the runner
      # it got. Then remove toolchains this job never uses. See docs/resource-math.md.
      - name: Free disk space
        run: |
          nproc
          free -g
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: ./
        with:
          mode: run
          config: examples/camunda/sentinel.yml
          target: ${{ matrix.target }}
          open-issues: ${{ github.event_name == 'schedule' }}

      - name: Show pods on failure
        if: failure()
        run: kubectl get pods -A -o wide || true

      - name: Delete leftover clusters
        if: always()
        run: kind get clusters | xargs -r -n1 kind delete cluster --name
